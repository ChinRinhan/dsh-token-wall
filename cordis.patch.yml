# Bundle patch layer: the row loads this package's main entry as the Host half
# (a plain Cordis plugin); the `dsh.client` declaration in package.json makes the
# web app load ./client.js as the browser half.
- insert:
    - id: dsh-token-usage
      name: 'dsh-token-usage'
      config:
        keepDays: 400
        includeSubagents: true
        includeAuxiliary: true
        statusBarEnabled: true
        statusBarRefreshMs: 1000
        backfillOnStart: true
